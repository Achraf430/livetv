name: Build PSX2 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODULE: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract ZIP
        run: |
          curl -L -o PSX2-master.zip https://github.com/${{ github.repository }}/releases/download/v1.0.2/PSX2-master.zip
          unzip -o PSX2-master.zip -d extracted_files
          GRADLE_PATH=$(find extracted_files -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            cp -r $GRADLE_PATH/* . 2>/dev/null || true
            cp -r $GRADLE_PATH/.* . 2>/dev/null || true
          fi
          rm -rf extracted_files PSX2-master.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Make Gradle executable
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease

      - name: Upload debug APK artifact
        if: github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: pcsx2-android-debug
          path: ${{ env.MODULE }}/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pcsx2-android-release
          path: ${{ env.MODULE }}/build/outputs/apk/release/*.apk
